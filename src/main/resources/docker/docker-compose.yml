services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "6000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./psql_dump_latest.sql:/docker-entrypoint-initdb.d/01_skillspot_dump.sql
    restart: unless-stopped

volumes:
  postgres_data:
