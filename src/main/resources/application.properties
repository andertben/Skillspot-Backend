spring.application.name=skillspot
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:6000/postgres?currentSchema=skillspot}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=skillspot
spring.flyway.default-schema=skillspot
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-cuabf3ql66715pfn.us.auth0.com/

spring.web.cors.mappings[/**].allowed-origins=http://188.245.196.16:8081
spring.web.cors.mappings[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.mappings[/**].allowed-headers=*
spring.web.cors.mappings[/**].allow-credentials=true
