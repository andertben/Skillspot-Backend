spring.application.name=skillspot
spring.datasource.url=jdbc:postgresql://localhost:6000/postgres?currentSchema=skillspot
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.schemas=skillspot
spring.flyway.default-schema=skillspot
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-cuabf3ql66715pfn.us.auth0.com/
